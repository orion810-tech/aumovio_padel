function HistoryDetail({ tournament, onBack, onDelete, onUpdate }) {
  const [tab, setTab] = useState("standings");
  const [askingDelete, setAskingDelete] = useState(false);
  const [askingEdit, setAskingEdit] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [nameDraft, setNameDraft] = useState("");

  if (!tournament) {
    return (
      <div className="min-h-full flex flex-col">
        <BackHeader onBack={onBack} title="Torneo" />
        <div className="flex-1 flex items-center justify-center p-8 text-center text-[var(--text-2)]">Torneo no encontrado.</div>
      </div>
    );
  }
  const getName = (id) => tournament.players.find((p) => p.id === id)?.name || "—";
  const enterEdit = () => { setNameDraft(tournament.name); setEditMode(true); setTab("rounds"); };

  const updateScore = (roundId, matchId, team, val) => {
    onUpdate(tournament.id, (t) => ({
      ...t,
      rounds: t.rounds.map((r) => {
        if (r.id !== roundId) return r;
        return {
          ...r,
          matches: r.matches.map((m) =>
            m.id !== matchId ? m : (team === "A" ? { ...m, scoreA: val } : { ...m, scoreB: val })
          ),
        };
      }),
    }));
  };

  const commitName = () => {
    const n = nameDraft.trim();
    if (n && n !== tournament.name) onUpdate(tournament.id, (t) => ({ ...t, name: n }));
  };

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title={editMode ? "Editando torneo" : tournament.name}
        right={
          editMode ? (
            <button onClick={() => setEditMode(false)}
              className="text-xs px-3 py-1.5 rounded-lg bg-[var(--lime)] text-black font-bold active:scale-95 transition-transform">Hecho</button>
          ) : (
            <div className="flex items-center gap-2">
              <button onClick={() => setAskingEdit(true)}
                className="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--text-2)] active:bg-[var(--surface)]">Editar</button>
              <button onClick={() => setAskingDelete(true)}
                className="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--red)] active:bg-[var(--surface)]">Eliminar</button>
            </div>
          )
        }/>
      <div className="px-5 pb-32 flex-1">

        {editMode && (
          <div className="mb-4">
            <SectionLabel accent>Nombre del torneo</SectionLabel>
            <input value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} onBlur={commitName}
              onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3 text-[15px] focus:border-[var(--lime)] focus:outline-none"/>
          </div>
        )}

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 mb-2 grid grid-cols-3 gap-3 text-center">
          <div>
            <div className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)]">Fecha</div>
            <div className="font-mono text-sm mt-1">{formatDate(tournament.startedAt)}</div>
          </div>
          <div>
            <div className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)]">Jugadores</div>
            <div className="font-mono text-sm mt-1">{tournament.players.length}</div>
          </div>
          <div>
            <div className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)]">Rondas</div>
            <div className="font-mono text-sm mt-1">{tournament.rounds.length}</div>
          </div>
        </div>
        <div className="text-center mb-4">
          <span className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)] border border-[var(--border)] rounded-lg px-2 py-1">
            Formato {FORMATS[getFormat(tournament)].short}
          </span>
        </div>

        {!editMode && tournament.winner && tournament.winner.points > 0 && (
          <div className="text-center my-4">
            <div className="text-[10px] tracking-[0.3em] uppercase text-[var(--text-3)] mb-2">Campeón</div>
            <div className="font-display font-extrabold text-3xl text-[var(--lime)] tracking-tight">{tournament.winner.name}</div>
            <div className="font-mono text-sm mt-1">
              {tournament.winner.points} <span className="text-[var(--text-3)] uppercase tracking-wider text-[10px]">pts</span>
            </div>
          </div>
        )}
        <div className="flex gap-1 bg-[var(--surface)] border border-[var(--border)] rounded-xl p-1 mb-4 mt-6">
          <button onClick={() => setTab("standings")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${tab === "standings" ? "bg-[var(--surface-2)]" : "text-[var(--text-3)]"}`}>Clasificación</button>
          <button onClick={() => setTab("rounds")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${tab === "rounds" ? "bg-[var(--surface-2)]" : "text-[var(--text-3)]"}`}>Rondas</button>
        </div>
        {tab === "standings" ? (
          <Standings players={tournament.players} rounds={tournament.rounds} />
        ) : (
          <div className="space-y-5">
            {editMode && (
              <div className="rounded-xl border border-[var(--lime)]/30 bg-[var(--lime)]/5 px-4 py-3 text-xs text-[var(--lime)] leading-relaxed">
                Modo edición: toca cualquier marcador para corregirlo. La clasificación y el campeón se recalculan al guardar.
              </div>
            )}
            {tournament.rounds.map((r, idx) => (
              <div key={r.id}>
                <div className="flex items-baseline justify-between mb-2 px-1">
                  <div className="font-display font-bold text-lg">
                    Ronda <span className="font-mono text-[var(--lime)]">{String(idx + 1).padStart(2, "0")}</span>
                  </div>
                  {r.sittingOut.length > 0 && (
                    <div className="text-xs text-[var(--text-3)]">Descansa: {r.sittingOut.map(getName).join(", ")}</div>
                  )}
                </div>
                {editMode ? (
                  <div className="space-y-3">
                    {r.matches.map((m) => (
                      <MatchCard key={m.id} match={m} players={tournament.players}
                        onScoreChange={(team, val) => updateScore(r.id, m.id, team, val)}/>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-1.5">
                    {r.matches.map((m) => {
                      const hasScore = m.scoreA != null && m.scoreB != null;
                      const winA = hasScore && m.scoreA > m.scoreB;
                      const winB = hasScore && m.scoreB > m.scoreA;
                      return (
                        <div key={m.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5">
                          <div className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)] mb-1 font-mono">Pista {String(m.court).padStart(2, "0")}</div>
                          <div className={`flex items-center justify-between ${winA ? "text-[var(--lime)]" : ""}`}>
                            <span className="truncate">{getName(m.teamA[0])} · {getName(m.teamA[1])}</span>
                            <span className="font-mono font-bold ml-2">{m.scoreA ?? "—"}</span>
                          </div>
                          <div className={`flex items-center justify-between ${winB ? "text-[var(--lime)]" : ""}`}>
                            <span className="truncate">{getName(m.teamB[0])} · {getName(m.teamB[1])}</span>
                            <span className="font-mono font-bold ml-2">{m.scoreB ?? "—"}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {editMode && (
        <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom z-20">
          <div className="max-w-md mx-auto">
            <button onClick={() => setEditMode(false)}
              className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg active:scale-[0.98] transition-transform tracking-tight">
              Hecho →
            </button>
          </div>
        </div>
      )}

      {askingEdit && (
        <AdminGate
          title="Editar torneo archivado"
          message="Vas a editar un torneo del historial (nombre y marcadores). Introduce las credenciales de administrador para continuar."
          onConfirm={() => { setAskingEdit(false); enterEdit(); }}
          onCancel={() => setAskingEdit(false)}
        />
      )}

      {askingDelete && (
        <AdminGate
          title={`Eliminar "${tournament.name}"`}
          message="Esta acción borra el torneo del historial de forma permanente. Introduce las credenciales de administrador para confirmar."
          onConfirm={() => { setAskingDelete(false); onDelete(); }}
          onCancel={() => setAskingDelete(false)}
        />
      )}
    </div>
  );
}

          <div className="text-[10px] tracking-[0.25em] uppercase text-[var(--red)] mb-1 font-medium">Irreversible · Requiere admin</div>

            {syncMode === "netlify"

        <AdminGate

            : "Esto eliminará el torneo en curso y todo el historial local. Acción irreversible. Introduce las credenciales de administrador."}

// ============================================================
// SESSIONS LIST (organizador)
// ============================================================
function SessionsList({ sessions, onOpen, onNew, onBack, syncMode, hasError }) {
  const now = Date.now();
  const withTs = (s) => {
    try { return new Date((s.date || "2100-01-01") + "T" + (s.time || "00:00")).getTime(); }
    catch { return 0; }
  };
  const sorted = [...(sessions || [])].sort((a, b) => withTs(a) - withTs(b));
  const upcoming = sorted.filter((s) => withTs(s) >= now - 6 * 3600 * 1000);
  const past = sorted.filter((s) => withTs(s) < now - 6 * 3600 * 1000).reverse();

  const Card = ({ s }) => {
    const c = rsvpCounts(s);
    return (
      <button onClick={() => onOpen(s.id)}
        className="w-full text-left rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 active:bg-[var(--surface-2)] transition-colors">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="font-display font-bold text-lg leading-tight truncate">{s.title}</div>
            <div className="text-xs text-[var(--text-2)] mt-1">{formatSessionWhen(s.date, s.time)}</div>
            {s.place && <div className="text-[11px] text-[var(--text-3)] mt-0.5 truncate">📍 {s.place}</div>}
          </div>
          <div className="text-right shrink-0">
            <div className="font-mono text-2xl font-bold leading-none text-[var(--lime)]">{c.yes}</div>
            <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-1">van</div>
          </div>
        </div>
        {s.closed && (
          <div className="text-[10px] tracking-[0.15em] uppercase text-[var(--orange)] mt-2">Cerrada</div>
        )}
      </button>
    );
  };

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title="Sesiones" right={<SyncBadge mode={syncMode} hasError={hasError}/>}/>
      <div className="px-5 pb-32 flex-1">
        {(!sessions || sessions.length === 0) ? (
          <div className="text-center py-16">
            <div className="text-5xl mb-4 opacity-30">📅</div>
            <p className="text-[var(--text-2)]">Aún no has convocado ninguna sesión.</p>
            <p className="text-xs text-[var(--text-3)] mt-2 max-w-xs mx-auto">
              Crea una, comparte el enlace y la gente confirma si viene. Sin necesidad de cuenta.
            </p>
          </div>
        ) : (
          <div className="space-y-5">
            {upcoming.length > 0 && (
              <div>
                <SectionLabel accent>Próximas</SectionLabel>
                <div className="space-y-2">{upcoming.map((s) => <Card key={s.id} s={s} />)}</div>
              </div>
            )}
            {past.length > 0 && (
              <div>
                <SectionLabel accent>Pasadas</SectionLabel>
                <div className="space-y-2 opacity-70">{past.map((s) => <Card key={s.id} s={s} />)}</div>
              </div>
            )}
          </div>
        )}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom z-20">
        <div className="max-w-md mx-auto">
          <button onClick={onNew}
            className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg active:scale-[0.98] transition-transform tracking-tight">
            Convocar sesión →
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SESSION EDITOR (crear / editar convocatoria)
// ============================================================
function SessionEditor({ initial, onSave, onBack }) {
  const [title, setTitle] = useState(initial?.title || "Pádel");
  const [date, setDate] = useState(initial?.date || "");
  const [time, setTime] = useState(initial?.time || "21:00");
  const [place, setPlace] = useState(initial?.place || "");
  const [note, setNote] = useState(initial?.note || "");

  const canSave = title.trim().length > 0 && date;

  const save = () => {
    if (!canSave) return;
    onSave({
      title: title.trim(),
      date, time,
      place: place.trim(),
      note: note.trim(),
    });
  };

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title={initial ? "Editar sesión" : "Nueva sesión"} />
      <div className="px-5 pb-32 flex-1 space-y-6">
        <section>
          <SectionLabel accent>Título</SectionLabel>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Pádel del jueves"
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] focus:border-[var(--lime)] focus:outline-none"/>
        </section>
        <section className="grid grid-cols-2 gap-3">
          <div>
            <SectionLabel accent>Fecha</SectionLabel>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] focus:border-[var(--lime)] focus:outline-none"/>
          </div>
          <div>
            <SectionLabel accent>Hora</SectionLabel>
            <input type="time" value={time} onChange={(e) => setTime(e.target.value)}
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] focus:border-[var(--lime)] focus:outline-none"/>
          </div>
        </section>
        <section>
          <SectionLabel accent>Lugar</SectionLabel>
          <input value={place} onChange={(e) => setPlace(e.target.value)} placeholder="Club de pádel..."
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] focus:border-[var(--lime)] focus:outline-none"/>
        </section>
        <section>
          <SectionLabel accent>Nota (opcional)</SectionLabel>
          <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={3}
            placeholder="Traed agua. Cancha reservada 90 min."
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] focus:border-[var(--lime)] focus:outline-none resize-none"/>
        </section>
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom">
        <div className="max-w-md mx-auto">
          <button disabled={!canSave} onClick={save}
            className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg disabled:opacity-30 active:scale-[0.98] transition-transform tracking-tight">
            {initial ? "Guardar cambios" : "Crear y obtener enlace"} →
          </button>
        </div>
      </div>
    </div>
  );
}

// Lista de nombres por estado
function RsvpGroup({ label, color, names }) {
  if (names.length === 0) return null;
  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <span className="w-2 h-2 rounded-full" style={{ background: color }} />
        <span className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)]">{label} · {names.length}</span>
      </div>
      <div className="flex flex-wrap gap-1.5">
        {names.map((n, i) => (
          <span key={i} className="text-sm bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-2.5 py-1">{n}</span>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// SESSION DETAIL (organizador: enlace, RSVPs, iniciar torneo)
// ============================================================
function SessionDetail({ session, onBack, onEdit, onDelete, onToggleClose, onStartTournament, onRefresh, syncMode }) {
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!session) return;
    onRefresh(session.id);
    const t = setInterval(() => onRefresh(session.id), 5000);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, [session?.id]);

  if (!session) {
    return (
      <div className="min-h-full flex flex-col">
        <BackHeader onBack={onBack} title="Sesión" />
        <div className="flex-1 flex items-center justify-center p-8 text-center text-[var(--text-2)]">Sesión no encontrada.</div>
      </div>
    );
  }

  const link = window.location.origin + window.location.pathname + "#/s/" + session.id;
  const c = rsvpCounts(session);
  const yesNames = (session.rsvps || []).filter((r) => r.status === "yes").map((r) => r.name);
  const maybeNames = (session.rsvps || []).filter((r) => r.status === "maybe").map((r) => r.name);
  const noNames = (session.rsvps || []).filter((r) => r.status === "no").map((r) => r.name);
  const courts = Math.floor(c.yes / 4);
  const leftover = c.yes % 4;

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1800); }
    catch {
      const ta = document.createElement("textarea"); ta.value = link; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch {}
      document.body.removeChild(ta);
    }
  };
  const shareWhatsApp = () => {
    const txt = `🎾 *${session.title}*\n${formatSessionWhen(session.date, session.time)}` +
      (session.place ? `\n📍 ${session.place}` : "") +
      (session.note ? `\n${session.note}` : "") +
      `\n\nConfirma si vienes 👇\n${link}`;
    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  };

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title={session.title}
        right={
          <div className="flex items-center gap-2">
            <button onClick={onEdit}
              className="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--text-2)] active:bg-[var(--surface)]">Editar</button>
            <button onClick={() => { if (confirm(`¿Eliminar la sesión "${session.title}"?`)) onDelete(); }}
              className="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--red)] active:bg-[var(--surface)]">✕</button>
          </div>
        }/>
      <div className="px-5 pb-32 flex-1 space-y-4">
        {/* Cabecera info */}
        <div className="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4">
          <div className="text-sm text-[var(--text)]">{formatSessionWhen(session.date, session.time)}</div>
          {session.place && <div className="text-xs text-[var(--text-2)] mt-1">📍 {session.place}</div>}
          {session.note && <div className="text-xs text-[var(--text-3)] mt-2 leading-relaxed whitespace-pre-wrap">{session.note}</div>}
        </div>

        {/* Contador grande */}
        <div className="rounded-2xl border border-[var(--lime)]/30 bg-[var(--lime)]/5 p-5">
          <div className="grid grid-cols-3 gap-2 text-center">
            <div>
              <div className="font-mono text-3xl font-bold text-[var(--lime)] leading-none">{c.yes}</div>
              <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-1.5">Van</div>
            </div>
            <div>
              <div className="font-mono text-3xl font-bold text-[var(--text-2)] leading-none">{c.maybe}</div>
              <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-1.5">Quizás</div>
            </div>
            <div>
              <div className="font-mono text-3xl font-bold text-[var(--text-3)] leading-none">{c.no}</div>
              <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-1.5">No van</div>
            </div>
          </div>
          {c.yes >= 4 && (
            <div className="mt-3 pt-3 border-t border-[var(--lime)]/20 text-[11px] text-[var(--text-2)] text-center leading-relaxed">
              {c.yes} confirmados → <strong className="text-[var(--lime)]">{courts} pista{courts !== 1 ? "s" : ""}</strong>
              {leftover > 0 && <> · {leftover} para completar otra</>}
            </div>
          )}
        </div>

        {/* Enlace + compartir */}
        <div className="space-y-2">
          <SectionLabel accent>Enlace para confirmar</SectionLabel>
          <div className="flex items-center gap-2 bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5">
            <span className="text-[11px] text-[var(--text-3)] font-mono truncate flex-1">{link}</span>
            <button onClick={copyLink}
              className={`text-xs px-3 py-1.5 rounded-lg font-medium shrink-0 transition-colors ${
                copied ? "bg-[var(--lime)] text-black" : "border border-[var(--border)] text-[var(--text-2)]"
              }`}>
              {copied ? "¡Copiado!" : "Copiar"}
            </button>
          </div>
          <button onClick={shareWhatsApp}
            className="w-full py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)] font-medium active:bg-[var(--surface-2)] transition-colors flex items-center justify-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4-1l-3 .8.8-2.9A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2.1-.2 0-.3 0-.5s-.5-1.3-.7-1.7-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3c-.3.3-1 .9-1 2.3s1 2.7 1.2 2.9 2 3 4.7 4.2c1.7.7 2.3.8 3.1.7.5-.1 1.4-.6 1.6-1.1s.2-1 .1-1.1-.3-.2-.5-.3z"/></svg>
            Compartir por WhatsApp
          </button>
        </div>

        {/* Listas de nombres */}
        {(session.rsvps || []).length > 0 ? (
          <div className="space-y-4 pt-2">
            <RsvpGroup label="Van" color="var(--lime)" names={yesNames} />
            <RsvpGroup label="Quizás" color="var(--text-2)" names={maybeNames} />
            <RsvpGroup label="No van" color="var(--text-3)" names={noNames} />
          </div>
        ) : (
          <div className="text-center py-6 text-xs text-[var(--text-3)]">
            Aún nadie ha confirmado. Comparte el enlace 👆
          </div>
        )}

        <div className="pt-2">
          <button onClick={() => onToggleClose(!session.closed)}
            className="w-full py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)] text-sm font-medium text-[var(--text-2)] active:bg-[var(--surface-2)]">
            {session.closed ? "Reabrir confirmaciones" : "Cerrar confirmaciones"}
          </button>
        </div>
      </div>

      {/* Iniciar torneo con los confirmados */}
      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom z-20">
        <div className="max-w-md mx-auto">
          <button disabled={c.yes < 4} onClick={() => onStartTournament(yesNames)}
            className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg disabled:opacity-30 active:scale-[0.98] transition-transform tracking-tight">
            {c.yes < 4 ? "Faltan confirmados (mín. 4)" : `Iniciar torneo con ${c.yes} →`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PUBLIC RSVP PAGE (sin login, accesible por #/s/<id>)
// ============================================================
function PublicRsvp({ sessionId }) {
  const [session, setSession] = useState(undefined); // undefined=cargando, null=no existe
  const [name, setName] = useState("");
  const [myStatus, setMyStatus] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const rsvpId = useMemo(() => getRsvpId(), []);

  const load = async () => {
    try {
      const { session } = await sessionsApiGet(sessionId);
      setSession(session || null);
      if (session) {
        const mine = (session.rsvps || []).find((r) => r.rsvpId === rsvpId);
        if (mine) { setName((n) => n || mine.name); setMyStatus(mine.status); }
      }
    } catch (e) { setError(e.message); setSession(null); }
  };

  useEffect(() => {
    load();
    const t = setInterval(load, 6000);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, [sessionId]);

  const submit = async (status) => {
    const n = name.trim();
    if (!n) { setError("Escribe tu nombre primero."); return; }
    setSaving(true); setError(null);
    try {
      const { session } = await sessionsApiPost({ action: "rsvp", sessionId, rsvpId, name: n, status });
      setSession(session); setMyStatus(status);
    } catch (e) { setError(e.message); }
    setSaving(false);
  };

  if (session === undefined) {
    return (
      <div className="max-w-md mx-auto min-h-full bg-[var(--bg)] flex items-center justify-center">
        <div className="flex items-center gap-3 text-[var(--text-3)] text-sm tracking-widest uppercase font-mono">
          <span className="w-2 h-2 rounded-full bg-[var(--lime)] pulse-dot"/> Cargando…
        </div>
      </div>
    );
  }

  if (session === null) {
    return (
      <div className="max-w-md mx-auto min-h-full bg-[var(--bg)] flex flex-col items-center justify-center p-8 text-center">
        <Logo size="md" />
        <div className="text-4xl mt-8 mb-3 opacity-30">🔍</div>
        <p className="text-[var(--text-2)]">Esta sesión no existe o fue eliminada.</p>
        <a href={window.location.pathname} className="text-[var(--lime)] text-sm mt-4 underline underline-offset-2">Ir al inicio</a>
      </div>
    );
  }

  const c = rsvpCounts(session);
  const yesNames = (session.rsvps || []).filter((r) => r.status === "yes").map((r) => r.name);
  const StatusBtn = ({ status, label, emoji, activeColor }) => {
    const active = myStatus === status;
    return (
      <button disabled={saving || session.closed} onClick={() => submit(status)}
        className={`flex-1 py-3.5 rounded-xl font-bold text-sm transition-all active:scale-95 disabled:opacity-50 border ${
          active ? "text-black border-transparent" : "text-[var(--text-2)] border-[var(--border)] bg-[var(--surface)]"
        }`}
        style={active ? { background: activeColor } : {}}>
        <div className="text-lg leading-none mb-1">{emoji}</div>
        {label}
      </button>
    );
  };

  return (
    <div className="max-w-md mx-auto min-h-full bg-[var(--bg)] flex flex-col p-5">
      <header className="pt-3 mb-8"><Logo size="md" /></header>

      <div className="flex-1">
        <div className="text-[10px] tracking-[0.3em] uppercase text-[var(--lime)] mb-2">Confirma tu asistencia</div>
        <h1 className="font-display text-[2.4rem] leading-[0.98] font-extrabold tracking-tight">{session.title}</h1>
        <div className="text-[var(--text-2)] mt-3">{formatSessionWhen(session.date, session.time)}</div>
        {session.place && <div className="text-sm text-[var(--text-3)] mt-1">📍 {session.place}</div>}
        {session.note && (
          <div className="mt-4 rounded-xl border border-[var(--border)] bg-[var(--surface)] p-4 text-sm text-[var(--text-2)] leading-relaxed whitespace-pre-wrap">
            {session.note}
          </div>
        )}

        {/* Contador */}
        <div className="mt-6 rounded-2xl border border-[var(--lime)]/30 bg-[var(--lime)]/5 p-5 text-center">
          <div className="font-mono text-4xl font-bold text-[var(--lime)] leading-none">{c.yes}</div>
          <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-2">
            confirmado{c.yes !== 1 ? "s" : ""}{c.maybe > 0 ? ` · ${c.maybe} quizás` : ""}
          </div>
          {yesNames.length > 0 && (
            <div className="flex flex-wrap gap-1.5 justify-center mt-3">
              {yesNames.map((n, i) => (
                <span key={i} className="text-xs bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-2.5 py-1">{n}</span>
              ))}
            </div>
          )}
        </div>

        {session.closed ? (
          <div className="mt-6 rounded-xl border border-[var(--orange)]/30 bg-[var(--orange)]/5 p-4 text-center text-sm text-[var(--orange)]">
            Las confirmaciones están cerradas para esta sesión.
          </div>
        ) : (
          <div className="mt-6">
            <SectionLabel>Tu nombre</SectionLabel>
            <input value={name} onChange={(e) => { setName(e.target.value); setError(null); }}
              placeholder="Escribe tu nombre"
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] placeholder:text-[var(--text-3)] focus:border-[var(--lime)] focus:outline-none mb-3"/>
            <div className="flex gap-2">
              <StatusBtn status="yes" label="Voy" emoji="✅" activeColor="var(--lime)" />
              <StatusBtn status="maybe" label="Quizás" emoji="🤔" activeColor="var(--orange)" />
              <StatusBtn status="no" label="No voy" emoji="❌" activeColor="var(--red)" />
            </div>
            {myStatus && !saving && (
              <div className="text-center text-xs text-[var(--lime)] mt-3 pop-in">
                ✓ Tu respuesta ({myStatus === "yes" ? "Voy" : myStatus === "maybe" ? "Quizás" : "No voy"}) quedó registrada. Puedes cambiarla cuando quieras.
              </div>
            )}
            {error && <div className="text-center text-xs text-[var(--red)] mt-3">{error}</div>}
          </div>
        )}
      </div>

      <footer className="text-center text-[var(--text-3)] text-[11px] mt-8 pb-2">
        Aumovio Padel · confirma sin necesidad de cuenta
      </footer>
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const [storeState, setStoreState] = useState({ active: null, history: [], sessions: [], mode: "init", synced: false, lastError: null });
  const [hydrated, setHydrated] = useState(false);
  const [authed, setAuthed] = useState(false);
  const [view, setView] = useState("home");
  const [detailId, setDetailId] = useState(null);
  const [sessionId, setSessionId] = useState(null);         // sesión abierta por el organizador
  const [publicSessionId, setPublicSessionId] = useState(() => readSessionRoute());

  // La ruta pública (#/s/<id>) se resuelve antes del login y reacciona a cambios de hash
  useEffect(() => {
    const onHash = () => setPublicSessionId(readSessionRoute());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    const unsub = dataStore.subscribe((snap) => {
      setStoreState(snap);
      if (snap.synced) setHydrated(true);
    });
    dataStore.init();
    const auth = lsGet(K_AUTH, { user: null });
    setAuthed(auth && auth.user === "aumovio");
    return unsub;
  }, []);

  const { active, history, sessions, mode: syncMode, lastError } = storeState;
  const hasError = !!lastError;

  // Página pública de confirmación: no requiere login, cortocircuita toda la app
  if (publicSessionId) {
    return <PublicRsvp sessionId={publicSessionId} />;
  }

  const login = () => { lsSet(K_AUTH, { user: "aumovio" }); setAuthed(true); };
  const logout = () => { lsSet(K_AUTH, { user: null }); setAuthed(false); setView("home"); };

  const setActive = (updater) => dataStore.setActive(updater);

  const startNew = (config) => {
    const firstRound = generateRound(config.players, config.courts, [], config.format);
    if (firstRound && config.roundDurationMin > 0) firstRound.timerStartedAt = Date.now();
    dataStore.setActive({
      id: uid(),
      name: config.name,
      startedAt: Date.now(),
      phase: "tournament",
      players: config.players,
      courts: config.courts,
      format: config.format,
      roundDurationMin: config.roundDurationMin,
      rounds: firstRound ? [firstRound] : [],
      currentRoundIndex: 0,
    });
    setView("tournament");
  };

  const archiveCurrent = async () => { await dataStore.archiveActiveTournament(); };
  const archiveAndHome = async () => { await archiveCurrent(); setView("home"); };

  const finishTournament = () => {
    dataStore.setActive((prev) => prev ? { ...prev, phase: "finished" } : null);
    setView("finished");
  };
  const continuePlaying = () => {
    dataStore.setActive((prev) => prev ? { ...prev, phase: "tournament" } : null);
    setView("tournament");
  };

  const resetAll = async () => {
    await dataStore.resetAll();
    lsDel(K_AUTH);
    setAuthed(false);
    setView("home");
  };

  const deleteHistoryItem = async () => {
    await dataStore.deleteHistoryItem(detailId);
    setView("history"); setDetailId(null);
  };

  const updateHistoryItem = (id, updater) => dataStore.updateHistoryItem(id, updater);

  // ---- Sesiones ----
  const [editingSession, setEditingSession] = useState(null); // objeto en edición o null (nueva)

  const saveSession = (data) => {
    if (editingSession && editingSession.id) {
      dataStore.updateSession({ ...editingSession, ...data });
      setSessionId(editingSession.id);
      setView("session-detail");
    } else {
      const s = { id: uid() + uid(), createdAt: Date.now(), closed: false, rsvps: [], ...data };
      dataStore.createSession(s);
      setSessionId(s.id);
      setView("session-detail");
    }
    setEditingSession(null);
  };

  const startTournamentFromSession = (names) => {
    const players = names.map((n) => ({ id: uid(), name: n, absent: false }));
    const courts = Math.max(1, Math.floor(players.length / 4));
    // Prefill del setup con los confirmados; el organizador ajusta formato/pistas antes de arrancar
    setPrefill({ players, courts });
    setView("setup");
  };
  const [prefill, setPrefill] = useState(null);

  const continueActive = () => {
    if (!active) return;
    setView(active.phase === "finished" ? "finished" : "tournament");
  };

  if (!hydrated) {
    return (
      <div className="min-h-full flex items-center justify-center">
        <div className="flex items-center gap-3 text-[var(--text-3)] text-sm tracking-widest uppercase font-mono">
          <span className="w-2 h-2 rounded-full bg-[var(--lime)] pulse-dot"/>
          Cargando…
        </div>
      </div>
    );
  }

  if (!authed) {
    return (
      <div className="max-w-md mx-auto min-h-full bg-[var(--bg)]">
        <Login onLogin={login} syncMode={syncMode} hasError={hasError}/>
      </div>
    );
  }

  let content;
  switch (view) {
    case "home":
      content = <Home data={{ active, history, sessions }} syncMode={syncMode} hasError={hasError}
        onContinue={continueActive}
        onNew={() => { setPrefill(null); setView("setup"); }}
        onHistory={() => setView("history")}
        onSessions={() => setView("sessions")}
        onSettings={() => setView("settings")} />;
      break;
    case "setup":
      content = <Setup onStart={(cfg) => { setPrefill(null); startNew(cfg); }} onBack={() => { setPrefill(null); setView("home"); }}
        hasActive={!!active} onArchiveActive={archiveCurrent} prefill={prefill} />;
      break;
    case "sessions":
      content = <SessionsList sessions={sessions} syncMode={syncMode} hasError={hasError}
        onOpen={(id) => { setSessionId(id); setView("session-detail"); }}
        onNew={() => { setEditingSession(null); setView("session-editor"); }}
        onBack={() => setView("home")} />;
      break;
    case "session-editor":
      content = <SessionEditor initial={editingSession}
        onSave={saveSession}
        onBack={() => { setEditingSession(null); setView(editingSession ? "session-detail" : "sessions"); }} />;
      break;
    case "session-detail": {
      const s = (sessions || []).find((x) => x.id === sessionId);
      content = <SessionDetail session={s} syncMode={syncMode}
        onBack={() => setView("sessions")}
        onEdit={() => { setEditingSession(s); setView("session-editor"); }}
        onDelete={() => { dataStore.deleteSession(sessionId); setSessionId(null); setView("sessions"); }}
        onToggleClose={(closed) => dataStore.closeSession(sessionId, closed)}
        onStartTournament={startTournamentFromSession}
        onRefresh={(id) => dataStore.refreshSession(id)} />;
      break;
    }
    case "tournament":
      if (!active) { setView("home"); content = null; break; }
      content = <Tournament active={active} setActive={setActive} syncMode={syncMode} hasError={hasError}
        onFinish={finishTournament} onBack={() => setView("home")} />;
      break;
    case "finished":
      if (!active) { setView("home"); content = null; break; }
      content = <Finished active={active} syncMode={syncMode} hasError={hasError}
        onArchiveAndExit={archiveAndHome} onContinue={continuePlaying} onBack={() => setView("home")} />;
      break;
    case "history":
      content = <HistoryList history={history} syncMode={syncMode} hasError={hasError}
        onSelect={(id) => { setDetailId(id); setView("history-detail"); }}
        onBack={() => setView("home")} />;
      break;
    case "history-detail":
      content = <HistoryDetail tournament={history.find((t) => t.id === detailId)}
        onBack={() => setView("history")} onDelete={deleteHistoryItem} onUpdate={updateHistoryItem} />;
      break;
    case "settings":
      content = <Settings onBack={() => setView("home")} onLogout={logout} onReset={resetAll}
        syncMode={syncMode} lastError={lastError}/>;
      break;
    default:
      content = <Home data={{ active, history, sessions }} syncMode={syncMode} hasError={hasError}
        onContinue={continueActive} onNew={() => { setPrefill(null); setView("setup"); }}
        onHistory={() => setView("history")} onSessions={() => setView("sessions")}
        onSettings={() => setView("settings")} />;
  }
  return <div className="max-w-md mx-auto min-h-full bg-[var(--bg)]">{content}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
