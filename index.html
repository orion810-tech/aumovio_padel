<script type="text/babel" data-presets="env,react">

// ╔══════════════════════════════════════════════════════════════╗
// ║ Configuración de sincronización                                ║
// ║ La app llama a /api/store (Netlify Function). Si la API no     ║
// ║ está disponible, la app cae en modo local automáticamente.     ║
// ╚══════════════════════════════════════════════════════════════╝
const API_URL = "/api/store";
const API_TOKEN = "aumovio";          // debe coincidir con el TOKEN de store.mjs
const POLL_MS = 4000;

const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// LOCAL STORAGE (fallback) — claves sin cambios: el historial se conserva
// ============================================================
const K_AUTH = "aumovio_auth_v1";
const K_DATA = "aumovio_data_v2";

function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function lsDel(key) { try { localStorage.removeItem(key); } catch {} }

// ============================================================
// HELPERS
// ============================================================
const uid = () => Math.random().toString(36).slice(2, 10);

const FORMATS = {
  americano: {
    label: "Americano",
    short: "Americano",
    desc: "Parejas al azar cada ronda, minimizando repeticiones. Todos juegan con todos.",
  },
  mexicano: {
    label: "Mexicano",
    short: "Mexicano",
    desc: "Las parejas se forman por clasificación: 1º+4º vs 2º+3º. Partidos más igualados.",
  },
};
const getFormat = (t) => (t && t.format === "mexicano" ? "mexicano" : "americano");
const getDuration = (t) => (t && typeof t.roundDurationMin === "number" ? t.roundDurationMin : 0);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function incPair(obj, a, b) {
  if (!obj[a]) obj[a] = {};
  if (!obj[b]) obj[b] = {};
  obj[a][b] = (obj[a][b] || 0) + 1;
  obj[b][a] = (obj[b][a] || 0) + 1;
}

function calcRoundsHistory(rounds) {
  const h = { partners: {}, opponents: {}, sitOuts: {} };
  rounds.forEach((r) => {
    r.matches.forEach((m) => {
      incPair(h.partners, m.teamA[0], m.teamA[1]);
      incPair(h.partners, m.teamB[0], m.teamB[1]);
      for (const a of m.teamA) for (const b of m.teamB) incPair(h.opponents, a, b);
    });
    (r.sittingOut || []).forEach((p) => { h.sitOuts[p] = (h.sitOuts[p] || 0) + 1; });
  });
  return h;
}

function calcStandings(players, rounds) {
  const stats = {};
  players.forEach((p) => {
    stats[p.id] = { id: p.id, name: p.name, absent: !!p.absent, retired: !!p.retired, points: 0, played: 0, won: 0, lost: 0, diff: 0 };
  });
  rounds.forEach((r) => {
    r.matches.forEach((m) => {
      if (m.scoreA == null || m.scoreB == null) return;
      const sA = Number(m.scoreA), sB = Number(m.scoreB);
      m.teamA.forEach((pid) => {
        if (!stats[pid]) return;
        stats[pid].points += sA; stats[pid].played += 1; stats[pid].diff += sA - sB;
        if (sA > sB) stats[pid].won++; else if (sA < sB) stats[pid].lost++;
      });
      m.teamB.forEach((pid) => {
        if (!stats[pid]) return;
        stats[pid].points += sB; stats[pid].played += 1; stats[pid].diff += sB - sA;
        if (sB > sA) stats[pid].won++; else if (sB < sA) stats[pid].lost++;
      });
    });
  });
  return Object.values(stats).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.diff !== a.diff) return b.diff - a.diff;
    return b.won - a.won;
  });
}

// ============================================================
// GENERACIÓN DE RONDAS (Americano / Mexicano)
// ============================================================
function generateRound(players, courts, completedRounds, format) {
  const fmt = format === "mexicano" ? "mexicano" : "americano";

  // Los jugadores marcados como ausentes no entran en la ronda,
  // pero conservan sus puntos en la clasificación.
  const available = players.filter((p) => !p.absent);
  if (available.length < 4) return null;

  const history = calcRoundsHistory(completedRounds);
  const maxPlay = courts * 4;
  let numPlay = Math.min(available.length, maxPlay);
  numPlay = Math.floor(numPlay / 4) * 4;
  if (numPlay < 4) return null;

  // --- QUIÉN JUEGA (común a los dos formatos) ---
  // Reparto JUSTO de descansos: nadie descansa por 2ª vez hasta que TODOS hayan
  // descansado 1ª; nadie por 3ª hasta que todos lleven 2, etc. Se ordena por total
  // de descansos DESCENDENTE (quien más ha descansado juega antes), así los que
  // menos han descansado quedan al final y son los que se sientan. Como desempate
  // entre iguales, no repite quien descansó la última ronda (evita 2 seguidas).
  const lastRound = completedRounds.length ? completedRounds[completedRounds.length - 1] : null;
  const satOutLast = new Set(lastRound ? (lastRound.sittingOut || []) : []);
  const sorted = shuffle([...available]).sort((a, b) => {
    const sa = history.sitOuts[a.id] || 0, sb = history.sitOuts[b.id] || 0;
    if (sa !== sb) return sb - sa;                        // (1) más descansos → juega antes
    const aLast = satOutLast.has(a.id) ? 1 : 0;
    const bLast = satOutLast.has(b.id) ? 1 : 0;
    return bLast - aLast;                                  // (2) descansó ayer → juega antes
  });
  const playingPlayers = sorted.slice(0, numPlay);
  const sittingOut = sorted.slice(numPlay).map((p) => p.id);
  const base = { id: uid(), sittingOut, completed: false, format: fmt, timerStartedAt: null, timerPausedElapsed: null };

  // --- MEXICANO: emparejar por clasificación (1º+4º vs 2º+3º) ---
  if (fmt === "mexicano") {
    const standings = calcStandings(players, completedRounds);
    const rankOf = {};
    standings.forEach((s, i) => { rankOf[s.id] = i; });
    const ranked = [...playingPlayers].sort(
      (a, b) => (rankOf[a.id] ?? 9999) - (rankOf[b.id] ?? 9999)
    );
    const matches = [];
    for (let i = 0; i < ranked.length; i += 4) {
      const g = ranked.slice(i, i + 4);
      matches.push({
        id: uid(),
        court: i / 4 + 1,
        teamA: [g[0].id, g[3].id],   // 1º + 4º del grupo
        teamB: [g[1].id, g[2].id],   // 2º + 3º del grupo
        scoreA: null, scoreB: null,
      });
    }
    return { ...base, matches };
  }

  // --- AMERICANO: prioridad ESTRICTA (lexicográfica) ---
  // (1) descansos justos ya está resuelto arriba (selección de quién juega).
  // (2) NO repetir pareja  >>  (3) NO repetir rival.
  // El peso de repetir pareja (1e6) domina de forma absoluta sobre repetir rival,
  // así que el algoritmo agota TODAS las parejas nuevas posibles antes de permitir
  // una repetición. Más intentos (4000) para encontrar el óptimo en grupos grandes.
  const playing = playingPlayers.map((p) => p.id);
  let best = null;
  let bestScore = Infinity;
  for (let t = 0; t < 4000; t++) {
    const sh = shuffle(playing);
    let score = 0;
    const matches = [];
    for (let i = 0; i < sh.length; i += 4) {
      const teamA = [sh[i], sh[i + 1]];
      const teamB = [sh[i + 2], sh[i + 3]];
      score += (history.partners[teamA[0]]?.[teamA[1]] || 0) * 1e6;   // (2) pareja repetida: penalización enorme
      score += (history.partners[teamB[0]]?.[teamB[1]] || 0) * 1e6;
      for (const a of teamA) for (const b of teamB) score += history.opponents[a]?.[b] || 0;  // (3) rival repetido
      matches.push({ id: uid(), court: i / 4 + 1, teamA, teamB, scoreA: null, scoreB: null });
    }
    if (score < bestScore) { bestScore = score; best = matches; if (bestScore === 0) break; }
  }
  return { ...base, matches: best };
}

function buildArchived(active) {
  if (!active) return null;
  const standings = calcStandings(active.players, active.rounds);
  return {
    id: active.id,
    name: active.name,
    startedAt: active.startedAt,
    finishedAt: Date.now(),
    players: active.players,
    courts: active.courts,
    format: getFormat(active),
    roundDurationMin: getDuration(active),
    rounds: active.rounds,
    standings,
    winner: standings[0] || null,
  };
}

function formatDate(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
}
function defaultName() {
  const d = new Date();
  return "Torneo " + d.toLocaleDateString("es-ES", { day: "2-digit", month: "short" });
}

// Aviso sonoro + vibración al acabar la ronda. Sin ficheros externos: Web Audio.
function alertEndOfRound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
      const ctx = new Ctx();
      const t0 = ctx.currentTime;
      [0, 0.28, 0.56].forEach((off) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, t0 + off);
        gain.gain.setValueAtTime(0.0001, t0 + off);
        gain.gain.exponentialRampToValueAtTime(0.35, t0 + off + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.22);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0 + off); osc.stop(t0 + off + 0.24);
      });
      setTimeout(() => { try { ctx.close(); } catch {} }, 1500);
    }
  } catch {}
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 500]); } catch {}
}

// ============================================================
// SESIONES (convocatorias con confirmación pública)
// ============================================================
const K_RSVP = "aumovio_rsvp_id_v1";   // identidad local anónima para editar el propio RSVP

// Identificador local estable por dispositivo, para que cada quien pueda cambiar su RSVP
function getRsvpId() {
  let id = lsGet(K_RSVP, null);
  if (!id) { id = uid() + uid(); lsSet(K_RSVP, id); }
  return id;
}

function formatSessionWhen(dateStr, timeStr) {
  if (!dateStr) return "Fecha por confirmar";
  try {
    const d = new Date(dateStr + "T" + (timeStr || "00:00"));
    const fecha = d.toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long" });
    const cap = fecha.charAt(0).toUpperCase() + fecha.slice(1);
    return timeStr ? `${cap} · ${timeStr}` : cap;
  } catch { return dateStr + (timeStr ? " " + timeStr : ""); }
}

const rsvpCounts = (session) => {
  const r = session?.rsvps || [];
  return {
    yes: r.filter((x) => x.status === "yes").length,
    maybe: r.filter((x) => x.status === "maybe").length,
    no: r.filter((x) => x.status === "no").length,
  };
};

// Lee el id de sesión de la URL pública (#/s/<id>)
function readSessionRoute() {
  const h = window.location.hash || "";
  const m = h.match(/^#\/s\/([A-Za-z0-9]+)/);
  return m ? m[1] : null;
}

// --- API pública de sesiones (sin token; ruta ?scope=sessions) ---
const SESSIONS_API = API_URL + "?scope=sessions";
async function sessionsApiGet(id) {
  const u = id ? SESSIONS_API + "&id=" + encodeURIComponent(id) : SESSIONS_API;
  const r = await fetch(u, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}
async function sessionsApiPost(body) {
  const r = await fetch(SESSIONS_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    cache: "no-store",
  });
  if (!r.ok) { const t = await r.text().catch(() => ""); throw new Error("HTTP " + r.status + " " + t); }
  return await r.json();
}

// ============================================================
// DATA STORE — capa de abstracción Netlify Blobs / localStorage
// ============================================================
function createDataStore() {
  const store = {
    mode: "init",
    synced: false,
    state: { active: null, history: [], sessions: [], updatedAt: 0 },
    listeners: new Set(),
    pollTimer: null,
    visibilityHandler: null,
    lastError: null,
    inFlight: 0,
    _writeChain: Promise.resolve(),

    subscribe(cb) {
      this.listeners.add(cb);
      cb(this.snapshot());
      return () => this.listeners.delete(cb);
    },
    notify() {
      const snap = this.snapshot();
      this.listeners.forEach((cb) => cb(snap));
    },
    snapshot() {
      return {
        ...this.state,
        sessions: this.state.sessions || [],
        mode: this.mode, synced: this.synced, lastError: this.lastError,
      };
    },

    async init() {
      try {
        const state = await this.apiGet();
        this.state = state;
        this.mode = "netlify";
        this.synced = true;
        this.lastError = null;
        this.startPolling();
      } catch (e) {
        console.warn("[Aumovio] API no disponible, modo local:", e.message);
        this.mode = "local";
        this.lastError = e.message;
        this.initLocal();
        this.synced = true;
      }
      this.notify();
    },

    initLocal() {
      const saved = lsGet(K_DATA, { active: null, history: [], updatedAt: 0 });
      this.state = saved;
    },
    persistLocal() {
      if (this.mode !== "netlify") lsSet(K_DATA, this.state);
    },

    startPolling() {
      const tick = async () => {
        if (this.inFlight > 0) return;
        if (document.hidden) return;
        try {
          const remote = await this.apiGet();
          const sameData =
            JSON.stringify(remote.active) === JSON.stringify(this.state.active) &&
            JSON.stringify(remote.history) === JSON.stringify(this.state.history);
          if (!sameData) {
            this.state = remote;
            this.lastError = null;
            this.notify();
          } else if (this.lastError) {
            this.lastError = null;
            this.notify();
          }
        } catch (e) {
          this.lastError = e.message;
          this.notify();
        }
      };
      this.pollTimer = setInterval(tick, POLL_MS);
      this.visibilityHandler = () => { if (!document.hidden) tick(); };
      document.addEventListener("visibilitychange", this.visibilityHandler);
    },

    async apiGet() {
      const r = await fetch(API_URL, {
        method: "GET",
        headers: { "X-Aumovio-Token": API_TOKEN },
        cache: "no-store",
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    },

    async apiPost(body) {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Aumovio-Token": API_TOKEN },
        body: JSON.stringify(body),
        cache: "no-store",
      });
      if (!r.ok) {
        const text = await r.text().catch(() => "");
        throw new Error("HTTP " + r.status + " " + text);
      }
      return await r.json();
    },

    // Serializa los POSTs en una cadena para que nunca se solapen, y NO sobrescribe
    // el estado local con la respuesta (el optimistic update ya tiene los datos
    // correctos). Esto elimina los blips por respuestas fuera de orden.
    _enqueueWrite(buildBody, label) {
      if (this.mode !== "netlify") return Promise.resolve();
      this.inFlight++;
      const promise = this._writeChain.then(async () => {
        try {
          const body = typeof buildBody === "function" ? buildBody() : buildBody;
          await this.apiPost(body);
          if (this.lastError) { this.lastError = null; this.notify(); }
        } catch (e) {
          console.error("[Aumovio] " + label + ":", e);
          this.lastError = e.message;
          this.notify();
        }
      });
      this._writeChain = promise.finally(() => { this.inFlight--; });
      return this._writeChain;
    },

    setActive(updater) {
      const newActive = typeof updater === "function" ? updater(this.state.active) : updater;
      this.state = { ...this.state, active: newActive, updatedAt: Date.now() };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite(
        () => ({ action: "set-active", active: this.state.active }),
        "setActive"
      );
    },

    archiveActiveTournament() {
      if (!this.state.active) return Promise.resolve();
      const archived = buildArchived(this.state.active);
      this.state = {
        ...this.state,
        active: null,
        history: [archived, ...this.state.history.filter((t) => t.id !== archived.id)],
        updatedAt: Date.now(),
      };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "archive", archived }, "archive");
    },

    deleteHistoryItem(id) {
      this.state = {
        ...this.state,
        history: this.state.history.filter((t) => t.id !== id),
        updatedAt: Date.now(),
      };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "delete-history", id }, "deleteHistory");
    },

    updateHistoryItem(id, updater) {
      const current = this.state.history.find((t) => t.id === id);
      if (!current) return Promise.resolve();
      const draft = typeof updater === "function" ? updater(current) : updater;
      const standings = calcStandings(draft.players, draft.rounds);
      const updated = { ...draft, standings, winner: standings[0] || null };
      this.state = {
        ...this.state,
        history: this.state.history.map((t) => (t.id === id ? updated : t)),
        updatedAt: Date.now(),
      };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "update-history", tournament: updated }, "updateHistory");
    },

    resetAll() {
      // Reset borra torneo activo + historial, pero NO las convocatorias de sesión.
      const keepSessions = this.state.sessions || [];
      this.state = { active: null, history: [], sessions: keepSessions, updatedAt: Date.now() };
      this.notify();
      if (this.mode !== "netlify") { lsDel(K_DATA); return Promise.resolve(); }
      return this._enqueueWrite({ action: "reset" }, "reset");
    },

    // ---- Gestión de sesiones (organizador, requiere token) ----
    createSession(session) {
      this.state = { ...this.state, sessions: [session, ...(this.state.sessions || [])] };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "create-session", session }, "createSession");
    },
    updateSession(session) {
      this.state = {
        ...this.state,
        sessions: (this.state.sessions || []).map((s) => s.id === session.id ? { ...s, ...session } : s),
      };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "update-session", session }, "updateSession");
    },
    closeSession(id, closed) {
      this.state = {
        ...this.state,
        sessions: (this.state.sessions || []).map((s) => s.id === id ? { ...s, closed } : s),
      };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "close-session", id, closed }, "closeSession");
    },
    deleteSession(id) {
      this.state = { ...this.state, sessions: (this.state.sessions || []).filter((s) => s.id !== id) };
      this.notify();
      if (this.mode !== "netlify") { this.persistLocal(); return Promise.resolve(); }
      return this._enqueueWrite({ action: "delete-session", id }, "deleteSession");
    },
    // Refresca una sesión concreta desde el servidor (para ver RSVPs nuevos al vuelo)
    async refreshSession(id) {
      if (this.mode !== "netlify") return;
      try {
        const { session } = await sessionsApiGet(id);
        if (session) {
          this.state = {
            ...this.state,
            sessions: (this.state.sessions || []).some((s) => s.id === id)
              ? this.state.sessions.map((s) => s.id === id ? session : s)
              : [session, ...(this.state.sessions || [])],
          };
          this.notify();
        }
      } catch {}
    },
  };
  return store;
}

// ============================================================
// ROUND TIMER — el reloj vive en cada dispositivo, solo se
// sincroniza el instante de arranque (timerStartedAt)
// ============================================================
function RoundTimer({ round, durationMin, onStart, onPause, onResume, onReset, onAddMinute }) {
  const durationMs = durationMin * 60000;
  const [now, setNow] = useState(() => Date.now());
  const firedRef = useRef(false);

  const running = round.timerStartedAt != null && round.timerPausedElapsed == null;
  const paused = round.timerPausedElapsed != null;
  const idle = !running && !paused;

  useEffect(() => {
    if (!running) return;
    setNow(Date.now());
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, [running, round.timerStartedAt]);

  useEffect(() => { firedRef.current = false; }, [round.id, round.timerStartedAt]);

  const elapsed = running ? now - round.timerStartedAt : (paused ? round.timerPausedElapsed : 0);
  const remaining = Math.max(0, durationMs - elapsed);
  const isUp = !idle && remaining <= 0;

  useEffect(() => {
    if (isUp && !firedRef.current) { firedRef.current = true; alertEndOfRound(); }
  }, [isUp]);

  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const pct = durationMs > 0 ? Math.max(0, Math.min(100, (remaining / durationMs) * 100)) : 0;
  const warn = !isUp && remaining <= 60000 && !idle;

  const barColor = isUp ? "var(--red)" : warn ? "var(--orange)" : "var(--lime)";
  const numColor = isUp ? "text-[var(--red)]" : warn ? "text-[var(--orange)]" : "text-[var(--text)]";

  return (
    <div className={`rounded-2xl border overflow-hidden ${isUp ? "border-[var(--red)]/40 flash-red" : "border-[var(--border)] bg-[var(--surface)]"}`}>
      <div className="px-4 pt-3 pb-2 flex items-center justify-between">
        <span className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)]">
          {isUp ? "¡Tiempo!" : paused ? "En pausa" : idle ? "Listo" : "Tiempo restante"}
        </span>
        <div className="flex items-center gap-1.5">
          {!idle && (
            <button onClick={onAddMinute}
              className="text-[10px] font-mono px-2 py-1 rounded-lg border border-[var(--border)] text-[var(--text-3)] active:bg-[var(--surface-2)]">
              +1′
            </button>
          )}
          {!idle && (
            <button onClick={onReset}
              className="text-[10px] font-mono px-2 py-1 rounded-lg border border-[var(--border)] text-[var(--text-3)] active:bg-[var(--surface-2)]">
              Reiniciar
            </button>
          )}
        </div>
      </div>

      <div className="px-4 pb-3 flex items-center gap-4">
        <div className={`font-mono font-bold text-[2.75rem] leading-none tabular-nums ${numColor}`}>
          {String(mins).padStart(2, "0")}:{String(secs).padStart(2, "0")}
        </div>
        <div className="flex-1">
          {idle && (
            <button onClick={onStart}
              className="w-full py-2.5 rounded-xl bg-[var(--lime)] text-black font-bold text-sm active:scale-95 transition-transform">
              Iniciar ronda
            </button>
          )}
          {running && (
            <button onClick={onPause}
              className="w-full py-2.5 rounded-xl border border-[var(--border)] bg-[var(--surface-2)] font-semibold text-sm active:scale-95 transition-transform">
              Pausar
            </button>
          )}
          {paused && (
            <button onClick={onResume}
              className="w-full py-2.5 rounded-xl bg-[var(--lime)] text-black font-bold text-sm active:scale-95 transition-transform">
              Reanudar
            </button>
          )}
        </div>
      </div>

      <div className="h-1.5 bg-[var(--surface-2)]">
        <div className="h-full transition-[width] duration-300 ease-linear"
          style={{ width: pct + "%", background: barColor }} />
      </div>
    </div>
  );
}

function Setup({ onStart, onBack, hasActive, onArchiveActive, prefill }) {
  const [name, setName] = useState(defaultName());
  const [players, setPlayers] = useState(prefill?.players || []);
  const [courts, setCourts] = useState(prefill?.courts || 2);
  const [format, setFormat] = useState("americano");
  const [duration, setDuration] = useState(15);
  const [nameInput, setNameInput] = useState("");
  const inputRef = useRef();

  const addPlayer = () => {
    const n = nameInput.trim();
    if (!n) return;
    if (players.some((p) => p.name.toLowerCase() === n.toLowerCase())) { setNameInput(""); return; }
    setPlayers([...players, { id: uid(), name: n, absent: false }]);
    setNameInput("");
    inputRef.current?.focus();
  };
  const removePlayer = (id) => setPlayers(players.filter((p) => p.id !== id));

  const canStart = players.length >= 4 && courts >= 1;
  const recommendedCourts = Math.max(1, Math.floor(players.length / 4));
  const isIdeal = players.length >= 4 && players.length % 4 === 0 && courts === players.length / 4;

  const startTournament = async () => {
    if (hasActive) {
      if (!confirm("Hay un torneo en curso. Se archivará automáticamente. ¿Continuar?")) return;
      await onArchiveActive();
    }
    onStart({ name: name.trim() || defaultName(), players, courts, format, roundDurationMin: duration });
  };

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title="Nuevo torneo" />
      <div className="flex-1 px-5 pb-32 space-y-6">
        <section>
          <SectionLabel accent>Nombre</SectionLabel>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Nombre del torneo"
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] placeholder:text-[var(--text-3)] focus:border-[var(--lime)] focus:outline-none"/>
        </section>

        <section>
          <SectionLabel accent>Formato</SectionLabel>
          <FormatPicker value={format} onChange={setFormat} />
        </section>

        <section>
          <SectionLabel accent>Duración de ronda</SectionLabel>
          <DurationPicker value={duration} onChange={setDuration} />
          <p className="text-[11px] text-[var(--text-3)] mt-2 leading-relaxed px-1">
            {duration === 0
              ? "Sin temporizador: terminas la ronda manualmente cuando quieras."
              : `Cada ronda dura ${duration} minutos. Aviso sonoro y vibración al acabar.`}
          </p>
        </section>

        <section>
          <SectionLabel accent>Jugadores · {players.length}</SectionLabel>
          <div className="flex gap-2">
            <input ref={inputRef} value={nameInput} onChange={(e) => setNameInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") addPlayer(); }} placeholder="Nombre del jugador"
              className="flex-1 bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3.5 text-[15px] placeholder:text-[var(--text-3)] focus:border-[var(--lime)] focus:outline-none"/>
            <button onClick={addPlayer} disabled={!nameInput.trim()}
              className="px-5 rounded-xl bg-[var(--lime)] text-black font-semibold text-[15px] disabled:opacity-30 active:scale-95 transition-transform">
              Añadir
            </button>
          </div>
          {players.length > 0 && (
            <ul className="mt-3 space-y-1.5">
              {players.map((p, i) => (
                <li key={p.id} className="flex items-center justify-between bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3 pop-in">
                  <div className="flex items-center gap-3 min-w-0">
                    <span className="font-mono text-[11px] text-[var(--text-3)] w-5">{String(i + 1).padStart(2, "0")}</span>
                    <span className="truncate">{p.name}</span>
                  </div>
                  <button onClick={() => removePlayer(p.id)}
                    className="text-[var(--text-3)] hover:text-[var(--red)] px-2 py-1 text-sm" aria-label="Eliminar">✕</button>
                </li>
              ))}
            </ul>
          )}
          {players.length > 0 && players.length < 4 && (
            <p className="mt-3 text-xs text-[var(--orange)]">Necesitas al menos 4 jugadores para empezar.</p>
          )}
        </section>

        <section>
          <SectionLabel accent>Pistas</SectionLabel>
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
            <div className="flex items-center justify-between">
              <button onClick={() => setCourts(Math.max(1, courts - 1))}
                className="w-10 h-10 rounded-lg border border-[var(--border)] active:bg-[var(--surface-2)] text-lg">−</button>
              <div className="text-center">
                <div className="font-mono text-4xl font-bold leading-none">{courts}</div>
                <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)] mt-2">{courts === 1 ? "pista" : "pistas"}</div>
              </div>
              <button onClick={() => setCourts(courts + 1)}
                className="w-10 h-10 rounded-lg border border-[var(--border)] active:bg-[var(--surface-2)] text-lg">+</button>
            </div>
          </div>
        </section>

        {players.length >= 4 && (
          <div className={`rounded-xl border px-4 py-3 text-xs leading-relaxed ${
            isIdeal ? "border-[var(--lime)]/30 bg-[var(--lime)]/5 text-[var(--lime)]"
                    : "border-[var(--border)] bg-[var(--surface)] text-[var(--text-2)]"
          }`}>
            {isIdeal ? (<>✓ Configuración óptima: nadie se sienta, todos juegan con todos.</>) : (
              <>Recomendado: <strong className="text-[var(--text)]">{recommendedCourts} pista{recommendedCourts !== 1 ? "s" : ""}</strong> con {players.length} jugadores
                {players.length % 4 !== 0 && (<> ({4 - (players.length % 4)} descansará{4 - (players.length % 4) !== 1 ? "n" : ""} por ronda)</>)}.</>
            )}
          </div>
        )}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom">
        <div className="max-w-md mx-auto">
          <button disabled={!canStart} onClick={startTournament}
            className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg disabled:opacity-30 active:scale-[0.98] transition-transform tracking-tight">
            Iniciar torneo →
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MATCH CARD (editing buffer para no romper la entrada con sync)
// ============================================================
function MatchCard({ match, players, onScoreChange, showSeeds }) {
  const getName = (id) => players.find((p) => p.id === id)?.name || "—";
  const hasScores = match.scoreA != null && match.scoreB != null;
  const winner = !hasScores ? null
    : Number(match.scoreA) > Number(match.scoreB) ? "A"
    : Number(match.scoreB) > Number(match.scoreA) ? "B" : "T";

  const [bufA, setBufA] = useState(match.scoreA == null ? "" : String(match.scoreA));
  const [bufB, setBufB] = useState(match.scoreB == null ? "" : String(match.scoreB));
  const [editing, setEditing] = useState({ A: false, B: false });

  useEffect(() => {
    if (!editing.A) setBufA(match.scoreA == null ? "" : String(match.scoreA));
  }, [match.scoreA, editing.A]);
  useEffect(() => {
    if (!editing.B) setBufB(match.scoreB == null ? "" : String(match.scoreB));
  }, [match.scoreB, editing.B]);

  const commitScore = (team, val) => {
    if (val === "") { onScoreChange(team, null); return; }
    const num = Math.max(0, parseInt(val, 10) || 0);
    onScoreChange(team, num);
  };

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden rise-in">
      <div className="px-4 py-2.5 flex items-center justify-between border-b border-[var(--border)]">
        <div className="flex items-center gap-2">
          <span className="font-mono text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)]">Pista</span>
          <span className="font-mono text-sm font-bold">{String(match.court).padStart(2, "0")}</span>
          {showSeeds && (
            <span className="text-[9px] tracking-[0.1em] uppercase text-[var(--text-3)] border border-[var(--border)] rounded px-1.5 py-0.5 ml-1">
              1+4 vs 2+3
            </span>
          )}
        </div>
        {hasScores && (
          <span className="text-[10px] tracking-[0.15em] uppercase font-medium text-[var(--lime)]">✓ registrado</span>
        )}
      </div>
      <div className="p-3 space-y-2">
        {["A", "B"].map((team) => {
          const tIds = team === "A" ? match.teamA : match.teamB;
          const isWinner = winner === team;
          const buf = team === "A" ? bufA : bufB;
          const setBuf = team === "A" ? setBufA : setBufB;
          return (
            <div key={team}
              className={`flex items-center gap-2 rounded-xl px-3 py-2.5 border transition-colors ${
                isWinner ? "bg-[var(--lime)]/8 border-[var(--lime)]/30" : "bg-[var(--surface-2)] border-transparent"
              }`}>
              <div className="flex-1 min-w-0">
                <div className="font-medium leading-tight truncate">
                  {getName(tIds[0])}<span className="text-[var(--text-3)] mx-1.5">·</span>{getName(tIds[1])}
                </div>
              </div>
              <input
                type="number" inputMode="numeric" min="0"
                value={buf}
                onFocus={() => setEditing((e) => ({ ...e, [team]: true }))}
                onChange={(e) => setBuf(e.target.value)}
                onBlur={() => {
                  setEditing((e) => ({ ...e, [team]: false }));
                  commitScore(team, buf);
                }}
                onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
                placeholder="—"
                className={`w-16 text-center font-mono text-2xl font-bold bg-transparent border rounded-lg py-1 outline-none transition-colors ${
                  isWinner ? "text-[var(--lime)] border-[var(--lime)]/40"
                           : "text-[var(--text)] border-[var(--border)] focus:border-[var(--text-2)]"
                }`}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// ROUND VIEW
// ============================================================
function RoundView({ round, players, onScoreChange, roundNum, totalRounds, isCurrent, onPrev, onNext,
                     format, durationMin, timerHandlers, onReshuffle }) {
  const getName = (id) => players.find((p) => p.id === id)?.name || "—";
  const absent = players.filter((p) => p.absent && !p.retired);   // ausentes temporales
  const retired = players.filter((p) => p.retired);                // retirados (no vuelven)
  const isMexicano = (round.format || format) === "mexicano";
  return (
    <div className="space-y-4">
      {/* Navegador de rondas */}
      <div className="flex items-center justify-between gap-2 px-1">
        <button onClick={onPrev} disabled={roundNum <= 1}
          className="w-10 h-10 rounded-xl border border-[var(--border)] flex items-center justify-center text-lg text-[var(--text-2)] disabled:opacity-25 active:bg-[var(--surface-2)]"
          aria-label="Ronda anterior">←</button>
        <div className="text-center flex-1">
          <div className={`text-[10px] tracking-[0.25em] uppercase mb-0.5 ${isCurrent ? "text-[var(--lime)]" : "text-[var(--text-3)]"}`}>
            {isCurrent ? "En curso" : "Finalizada · editable"}
          </div>
          <h2 className="font-display text-[2rem] leading-none font-extrabold tracking-tight">
            Ronda <span className="text-[var(--lime)] font-mono">{String(roundNum).padStart(2, "0")}</span>
            <span className="text-[var(--text-3)] font-mono text-base"> / {String(totalRounds).padStart(2, "0")}</span>
          </h2>
        </div>
        <button onClick={onNext} disabled={roundNum >= totalRounds}
          className="w-10 h-10 rounded-xl border border-[var(--border)] flex items-center justify-center text-lg text-[var(--text-2)] disabled:opacity-25 active:bg-[var(--surface-2)]"
          aria-label="Ronda siguiente">→</button>
      </div>

      {/* Temporizador (solo en la ronda en curso y si hay duración) */}
      {isCurrent && durationMin > 0 && (
        <RoundTimer round={round} durationMin={durationMin} {...timerHandlers} />
      )}

      {isCurrent && onReshuffle && (
        <div className="flex justify-end -mb-1">
          <button onClick={onReshuffle}
            className="flex items-center gap-1.5 text-[11px] tracking-[0.1em] uppercase px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--text-3)] active:bg-[var(--surface-2)] transition-colors">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8"/>
              <path d="M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </svg>
            Repetir sorteo
          </button>
        </div>
      )}

      <div className="space-y-3">
        {round.matches.map((m) => (
          <MatchCard key={m.id} match={m} players={players} showSeeds={isMexicano}
            onScoreChange={(team, val) => onScoreChange(m.id, team, val)}/>
        ))}
      </div>

      {round.sittingOut && round.sittingOut.length > 0 && (
        <div className="bg-[var(--surface)] border border-dashed border-[var(--border)] rounded-2xl p-4">
          <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)] mb-2">Descansan esta ronda</div>
          <div className="flex flex-wrap gap-1.5">
            {round.sittingOut.map((id) => (
              <span key={id} className="text-xs bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-[var(--text-2)]">
                {getName(id)}
              </span>
            ))}
          </div>
        </div>
      )}

      {isCurrent && absent.length > 0 && (
        <div className="bg-[var(--orange)]/5 border border-dashed border-[var(--orange)]/30 rounded-2xl p-4">
          <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--orange)] mb-2">
            Ausentes · no entran en el sorteo
          </div>
          <div className="flex flex-wrap gap-1.5">
            {absent.map((p) => (
              <span key={p.id} className="text-xs bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-[var(--text-3)]">
                {p.name}
              </span>
            ))}
          </div>
        </div>
      )}

      {isCurrent && retired.length > 0 && (
        <div className="bg-[var(--red)]/5 border border-dashed border-[var(--red)]/30 rounded-2xl p-4">
          <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--red)] mb-2">
            Retirados · mantienen sus puntos en la clasificación
          </div>
          <div className="flex flex-wrap gap-1.5">
            {retired.map((p) => (
              <span key={p.id} className="text-xs bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-[var(--text-3)] line-through">
                {p.name}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// STANDINGS
// ============================================================
function Standings({ players, rounds, compact }) {
  const standings = useMemo(() => calcStandings(players, rounds), [players, rounds]);
  return (
    <div className="space-y-1">
      {standings.map((s, i) => {
        const isLeader = i === 0 && s.points > 0;
        return (
          <div key={s.id}
            className={`flex items-center gap-3 px-3 py-3 rounded-xl border transition-colors ${
              isLeader ? "bg-[var(--lime)]/8 border-[var(--lime)]/30" : "bg-[var(--surface)] border-[var(--border)]"
            } ${s.absent ? "opacity-55" : ""}`}>
            <div className={`font-mono text-xs w-6 text-center ${isLeader ? "text-[var(--lime)] font-bold" : "text-[var(--text-3)]"}`}>
              {String(i + 1).padStart(2, "0")}
            </div>
            <div className="flex-1 min-w-0">
              <div className="font-medium truncate flex items-center gap-2">
                {s.name}
                {s.retired ? (
                  <span className="text-[9px] tracking-[0.1em] uppercase text-[var(--red)] border border-[var(--red)]/40 rounded px-1.5 py-0.5 shrink-0">
                    retirado
                  </span>
                ) : s.absent ? (
                  <span className="text-[9px] tracking-[0.1em] uppercase text-[var(--orange)] border border-[var(--orange)]/40 rounded px-1.5 py-0.5 shrink-0">
                    ausente
                  </span>
                ) : null}
              </div>
              {!compact && (
                <div className="text-[11px] text-[var(--text-3)] mt-0.5 font-mono">
                  {s.played} PJ · {s.won}V {s.lost}D · {s.diff > 0 ? "+" : ""}{s.diff}
                </div>
              )}
            </div>
            <div className="text-right">
              <div className={`font-mono text-2xl font-bold leading-none ${isLeader ? "text-[var(--lime)]" : "text-[var(--text)]"}`}>
                {s.points}
              </div>
              {!compact && <div className="text-[10px] uppercase tracking-wider text-[var(--text-3)] mt-1">pts</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// TOURNAMENT CONFIG — formato, temporizador, pistas y jugadores
// ============================================================
function TournamentConfig({ players, courts, format, durationMin,
                            onAdd, onRemove, onToggleAbsent, onCourtsChange, onFormatChange, onDurationChange, onClose }) {
  const [name, setName] = useState("");
  const inputRef = useRef();
  useEffect(() => { inputRef.current?.focus(); }, []);
  const add = () => {
    const t = name.trim();
    if (!t) return;
    if (players.some((p) => p.name.toLowerCase() === t.toLowerCase())) { setName(""); return; }
    onAdd(t); setName("");
  };
  const accept = () => {
    const t = name.trim();
    if (t && !players.some((p) => p.name.toLowerCase() === t.toLowerCase())) onAdd(t);
    onClose();
  };
  const activeCount = players.filter((p) => !p.absent).length;
  const recommendedCourts = Math.max(1, Math.floor(activeCount / 4));
  const isIdeal = activeCount >= 4 && activeCount % 4 === 0 && courts === activeCount / 4;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-sm pop-in" onClick={onClose}>
      <div className="w-full max-w-md bg-[var(--surface)] border-t border-[var(--border)] rounded-t-3xl flex flex-col max-h-[88vh]" onClick={(e) => e.stopPropagation()}>

        <div className="px-5 pt-5 pb-3 flex items-center justify-between shrink-0">
          <h3 className="font-display font-bold text-xl">Configuración</h3>
          <button onClick={onClose} className="text-[var(--text-3)] text-xl px-2" aria-label="Cerrar">✕</button>
        </div>

        <div className="px-5 pb-2 flex-1 overflow-y-auto">
          {/* Formato */}
          <SectionLabel>Formato</SectionLabel>
          <div className="mb-5">
            <FormatPicker value={format} onChange={onFormatChange} />
            <p className="text-[11px] text-[var(--orange)] mt-2 px-1">
              El cambio se aplica a partir de la próxima ronda.
            </p>
          </div>

          {/* Temporizador */}
          <SectionLabel>Duración de ronda</SectionLabel>
          <div className="mb-5">
            <DurationPicker value={durationMin} onChange={onDurationChange} />
          </div>

          {/* Pistas */}
          <SectionLabel>Pistas</SectionLabel>
          <div className="bg-[var(--surface-2)] border border-[var(--border)] rounded-xl p-3 mb-2">
            <div className="flex items-center justify-between">
              <button onClick={() => onCourtsChange(Math.max(1, courts - 1))}
                className="w-10 h-10 rounded-lg border border-[var(--border)] active:bg-[var(--surface)] text-lg" aria-label="Una pista menos">−</button>
              <div className="text-center">
                <div className="font-mono text-3xl font-bold leading-none">{courts}</div>
                <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)] mt-1.5">
                  {courts === 1 ? "pista" : "pistas"}
                </div>
              </div>
              <button onClick={() => onCourtsChange(courts + 1)}
                className="w-10 h-10 rounded-lg border border-[var(--border)] active:bg-[var(--surface)] text-lg" aria-label="Una pista más">+</button>
            </div>
          </div>
          <p className={`text-[11px] leading-relaxed mb-5 ${isIdeal ? "text-[var(--lime)]" : "text-[var(--text-3)]"}`}>
            {isIdeal
              ? "✓ Configuración óptima: nadie se sienta, todos juegan con todos."
              : activeCount >= 4
                ? `Recomendado: ${recommendedCourts} pista${recommendedCourts !== 1 ? "s" : ""} con ${activeCount} disponibles${activeCount % 4 !== 0 ? ` (${4 - (activeCount % 4)} descansa${4 - (activeCount % 4) !== 1 ? "n" : ""} por ronda)` : ""}.`
                : "Necesitas al menos 4 jugadores disponibles."}
          </p>

          {/* Jugadores */}
          <SectionLabel>Jugadores · {activeCount} de {players.length}</SectionLabel>
          <div className="flex gap-2 mb-3">
            <input ref={inputRef} value={name} onChange={(e) => setName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") add(); }} placeholder="Nuevo jugador"
              className="flex-1 bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-4 py-3 focus:border-[var(--lime)] focus:outline-none"/>
            <button onClick={add} disabled={!name.trim()}
              className="px-5 rounded-xl bg-[var(--lime)] text-black font-semibold disabled:opacity-30 active:scale-95 transition-transform">+</button>
          </div>
          <p className="text-xs text-[var(--text-3)] mb-3 leading-relaxed">
            Toca <strong className="text-[var(--text-2)]">Ausente</strong> si alguien se va un rato o llega tarde: no entra en el
            sorteo pero conserva sus puntos. Los cambios se aplican en la próxima ronda.
          </p>
          <ul className="space-y-1.5">
            {players.map((p, i) => (
              <li key={p.id}
                className={`flex items-center justify-between border rounded-xl px-3 py-2.5 transition-colors ${
                  p.absent ? "bg-[var(--surface)] border-[var(--orange)]/25 opacity-60" : "bg-[var(--surface-2)] border-[var(--border)]"
                }`}>
                <div className="flex items-center gap-3 min-w-0">
                  <span className="font-mono text-[11px] text-[var(--text-3)] w-5">{String(i + 1).padStart(2, "0")}</span>
                  <span className={`truncate ${p.absent ? "line-through text-[var(--text-3)]" : ""}`}>{p.name}</span>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  {p.retired ? (
                    // Un jugador retirado no vuelve al sorteo; su marca queda en la tabla.
                    <span className="text-[10px] tracking-[0.1em] uppercase px-2 py-1.5 rounded-lg border border-[var(--red)]/40 text-[var(--red)] bg-[var(--red)]/10">
                      Retirado
                    </span>
                  ) : (
                    <>
                      <button onClick={() => onToggleAbsent(p.id)}
                        className={`text-[10px] tracking-[0.1em] uppercase px-2 py-1.5 rounded-lg border transition-colors ${
                          p.absent
                            ? "border-[var(--orange)]/50 text-[var(--orange)] bg-[var(--orange)]/10"
                            : "border-[var(--border)] text-[var(--text-3)] active:bg-[var(--surface)]"
                        }`}>
                        {p.absent ? "Ausente" : "Juega"}
                      </button>
                      <button onClick={() => {
                        if (confirm(`¿Retirar a ${p.name}? Sale de las próximas rondas pero sus puntos se mantienen en la clasificación hasta el final.`)) onRemove(p.id);
                      }} className="text-[10px] tracking-[0.1em] uppercase px-2 py-1.5 rounded-lg border border-[var(--border)] text-[var(--text-3)] hover:text-[var(--red)] active:bg-[var(--surface)]" aria-label={`Retirar ${p.name}`}>Retirar</button>
                    </>
                  )}
                </div>
              </li>
            ))}
          </ul>
        </div>

        <div className="px-5 pt-3 safe-bottom border-t border-[var(--border)] shrink-0 bg-[var(--surface)]">
          <button onClick={accept}
            className="w-full py-3.5 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg active:scale-[0.98] transition-transform tracking-tight">
            Aceptar →
          </button>
        </div>

      </div>
    </div>
  );
}

// ============================================================
// ADMIN GATE
// ============================================================
function AdminGate({ title, message, onConfirm, onCancel }) {
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState(false);
  const [show, setShow] = useState(false);
  const userRef = useRef();
  useEffect(() => { userRef.current?.focus(); }, []);

  const submit = (e) => {
    if (e) e.preventDefault();
    if (user.trim().toLowerCase() === "admin" && pass === "padelrifa") {
      setError(false); onConfirm();
    } else { setError(true); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm pop-in" onClick={onCancel}>
      <div className="w-full max-w-md bg-[var(--surface)] border-t border-[var(--red)]/30 rounded-t-3xl p-5 safe-bottom" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-2">
          <div className="text-[10px] tracking-[0.25em] uppercase text-[var(--red)] font-medium">Acción protegida</div>
          <button onClick={onCancel} className="text-[var(--text-3)] text-xl px-2" aria-label="Cancelar">✕</button>
        </div>
        <h3 className="font-display font-bold text-xl text-[var(--red)] leading-tight">{title}</h3>
        {message && <p className="text-xs text-[var(--text-2)] mt-2 leading-relaxed">{message}</p>}

        <form onSubmit={submit} className="space-y-2.5 mt-5">
          <input ref={userRef} value={user}
            onChange={(e) => { setUser(e.target.value); setError(false); }}
            placeholder="Usuario admin" autoComplete="off" autoCapitalize="none" autoCorrect="off"
            className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-4 py-3 text-[15px] placeholder:text-[var(--text-3)] focus:border-[var(--red)] focus:outline-none"/>
          <div className="relative">
            <input type={show ? "text" : "password"} value={pass}
              onChange={(e) => { setPass(e.target.value); setError(false); }}
              placeholder="Contraseña" autoComplete="off"
              className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-4 py-3 pr-16 text-[15px] placeholder:text-[var(--text-3)] focus:border-[var(--red)] focus:outline-none"/>
            <button type="button" onClick={() => setShow(!show)}
              className="absolute right-2 top-1/2 -translate-y-1/2 text-xs px-2 py-1 text-[var(--text-3)]">
              {show ? "ocultar" : "ver"}
            </button>
          </div>
          {error && (
            <div className="text-xs text-[var(--red)] px-1 pop-in">Credenciales de administrador incorrectas.</div>
          )}
          <div className="grid grid-cols-2 gap-2 pt-2">
            <button type="button" onClick={onCancel}
              className="py-3 rounded-xl border border-[var(--border)] bg-[var(--surface-2)] font-medium active:scale-95 transition-transform">
              Cancelar
            </button>
            <button type="submit"
              className="py-3 rounded-xl bg-[var(--red)] text-white font-bold active:scale-95 transition-transform">
              Confirmar
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ============================================================
// END ROUND SHEET — solo aparece si faltan resultados.
// Distingue entre "se jugó pero no se apuntó" y "no se jugó".
// ============================================================
function EndRoundSheet({ roundNum, total, filled, isMexicano, onSave, onDiscard, onCancel }) {
  const missing = total - filled;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm pop-in" onClick={onCancel}>
      <div className="w-full max-w-md bg-[var(--surface)] border-t border-[var(--border)] rounded-t-3xl p-5 safe-bottom max-h-[88vh] overflow-y-auto"
        onClick={(e) => e.stopPropagation()}>

        <div className="flex items-start justify-between mb-1">
          <div className="text-[10px] tracking-[0.25em] uppercase text-[var(--orange)] font-medium">
            Faltan resultados
          </div>
          <button onClick={onCancel} className="text-[var(--text-3)] text-xl px-2 -mt-1" aria-label="Cancelar">✕</button>
        </div>

        <h3 className="font-display font-bold text-xl leading-tight">
          Ronda <span className="font-mono text-[var(--lime)]">{String(roundNum).padStart(2, "0")}</span>
          <span className="text-[var(--text-3)]"> · </span>
          <span className="font-mono">{missing}</span> de <span className="font-mono">{total}</span> sin marcador
        </h3>
        <p className="text-xs text-[var(--text-2)] mt-2 leading-relaxed">
          Los partidos sin marcador no suman puntos en la clasificación. ¿Qué quieres hacer con esta ronda?
        </p>

        <div className="space-y-2.5 mt-5">
          {/* GUARDAR */}
          <button onClick={onSave}
            className="w-full text-left rounded-2xl bg-[var(--lime)] text-black p-4 active:scale-[0.98] transition-transform">
            <div className="font-display font-bold text-lg leading-tight">Guardar la ronda</div>
            <div className="text-[11px] mt-1 leading-relaxed opacity-80">
              Se jugó, pero sin apuntar. Las parejas y los descansos quedan registrados para la rotación de las
              próximas rondas.
            </div>
          </button>

          {/* DESCARTAR */}
          <button onClick={() => {
            if (filled > 0 && !confirm(`Se perderá${filled !== 1 ? "n" : ""} ${filled} resultado${filled !== 1 ? "s" : ""} ya apuntado${filled !== 1 ? "s" : ""}. ¿Descartar la ronda igualmente?`)) return;
            onDiscard();
          }}
            className="w-full text-left rounded-2xl border border-[var(--orange)]/35 bg-[var(--orange)]/5 p-4 active:bg-[var(--orange)]/10 transition-colors">
            <div className="font-display font-bold text-lg leading-tight text-[var(--orange)]">Descartar la ronda</div>
            <div className="text-[11px] text-[var(--text-2)] mt-1 leading-relaxed">
              No se jugó. Se sortea de nuevo sin gastar parejas ni descansos, y el contador de rondas no avanza.
              {filled > 0 && (
                <span className="text-[var(--orange)]"> Se perderá{filled !== 1 ? "n" : ""} {filled} resultado{filled !== 1 ? "s" : ""} ya apuntado{filled !== 1 ? "s" : ""}.</span>
              )}
            </div>
            {isMexicano && (
              <div className="text-[10px] text-[var(--text-3)] mt-2 leading-relaxed border-t border-[var(--border)] pt-2">
                En Mexicano las parejas salen de la clasificación: al descartar volverán a salir las mismas.
              </div>
            )}
          </button>

          {/* CANCELAR */}
          <button onClick={onCancel}
            className="w-full py-3.5 rounded-xl border border-[var(--border)] bg-[var(--surface-2)] font-medium active:scale-95 transition-transform">
            Cancelar y apuntar resultados
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// TOURNAMENT
// ============================================================
function Tournament({ active, setActive, onFinish, onBack, syncMode, hasError }) {
  const { players, courts, rounds, currentRoundIndex } = active;
  const format = getFormat(active);
  const durationMin = getDuration(active);
  const [tab, setTab] = useState("round");
  const [showConfig, setShowConfig] = useState(false);
  const [showEndSheet, setShowEndSheet] = useState(false);
  const [viewRound, setViewRound] = useState(currentRoundIndex);

  useEffect(() => { setViewRound(currentRoundIndex); }, [currentRoundIndex]);

  const availableCount = players.filter((p) => !p.absent).length;

  // Safety net: si la ronda actual no existe (estado antiguo o corrupto), genérala.
  useEffect(() => {
    if (rounds[currentRoundIndex]) return;
    const completed = rounds.slice(0, currentRoundIndex);
    const next = generateRound(players, courts, completed, format);
    if (!next) return;
    if (durationMin > 0) next.timerStartedAt = Date.now();
    setActive((prev) => {
      if (!prev || prev.rounds[prev.currentRoundIndex]) return prev;
      return { ...prev, rounds: [...prev.rounds.slice(0, prev.currentRoundIndex), next] };
    });
  }, [currentRoundIndex, availableCount]);

  const isCurrent = viewRound === currentRoundIndex;
  const round = rounds[viewRound];

  const updateScore = (matchId, team, val) => {
    setActive((prev) => ({
      ...prev,
      rounds: prev.rounds.map((r, idx) => {
        if (idx !== viewRound) return r;
        return {
          ...r,
          matches: r.matches.map((m) =>
            m.id !== matchId ? m : (team === "A" ? { ...m, scoreA: val } : { ...m, scoreB: val })
          ),
        };
      }),
    }));
  };

  // --- Temporizador: solo se sincroniza el instante de arranque ---
  const patchRound = (patch) => {
    setActive((prev) => ({
      ...prev,
      rounds: prev.rounds.map((r, idx) => (idx === viewRound ? { ...r, ...patch } : r)),
    }));
  };
  const timerHandlers = {
    onStart:  () => patchRound({ timerStartedAt: Date.now(), timerPausedElapsed: null }),
    onPause:  () => patchRound({ timerStartedAt: null, timerPausedElapsed: Date.now() - (round?.timerStartedAt || Date.now()) }),
    onResume: () => patchRound({ timerStartedAt: Date.now() - (round?.timerPausedElapsed || 0), timerPausedElapsed: null }),
    onReset:  () => patchRound({ timerStartedAt: null, timerPausedElapsed: null }),
    onAddMinute: () => {
      if (!round) return;
      if (round.timerPausedElapsed != null) {
        patchRound({ timerPausedElapsed: Math.max(0, round.timerPausedElapsed - 60000) });
      } else if (round.timerStartedAt != null) {
        patchRound({ timerStartedAt: round.timerStartedAt + 60000 });
      }
    },
  };

  // ATÓMICO: completar ronda + avanzar índice + generar la siguiente en una sola
  // transición de estado. Evita el race condition que producía blips.
  // Esta es la opción "Guardar la ronda": las parejas y descansos SÍ cuentan
  // para la rotación aunque no se hayan apuntado marcadores.
  const endRound = () => {
    setActive((prev) => {
      const fmt = getFormat(prev);
      const dur = getDuration(prev);
      const completedRounds = prev.rounds.map((r, idx) =>
        idx === prev.currentRoundIndex ? { ...r, completed: true } : r
      );
      const newIndex = prev.currentRoundIndex + 1;
      const nextRound = generateRound(prev.players, prev.courts, completedRounds.slice(0, newIndex), fmt);
      if (nextRound && dur > 0) nextRound.timerStartedAt = Date.now();
      const newRounds = nextRound ? [...completedRounds, nextRound] : completedRounds;
      return { ...prev, rounds: newRounds, currentRoundIndex: newIndex };
    });
    setShowEndSheet(false);
    setTab("round");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // Sustituye la ronda actual por un sorteo nuevo SIN avanzar el contador.
  // La ronda descartada no deja rastro: no quema parejas ni cuenta descansos.
  // Comparten esta función "Descartar la ronda" y "Repetir sorteo".
  const regenerateCurrentRound = () => {
    setActive((prev) => {
      const fmt = getFormat(prev);
      const dur = getDuration(prev);
      const idx = prev.currentRoundIndex;
      const previousRounds = prev.rounds.slice(0, idx);   // se descarta la actual y lo que venga después
      const fresh = generateRound(prev.players, prev.courts, previousRounds, fmt);
      if (fresh && dur > 0) fresh.timerStartedAt = Date.now();
      const newRounds = fresh ? [...previousRounds, fresh] : previousRounds;
      return { ...prev, rounds: newRounds, currentRoundIndex: idx };
    });
    setShowEndSheet(false);
    setTab("round");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // "Repetir sorteo" desde la ronda en curso: avisa si ya hay resultados apuntados.
  const reshuffleRound = () => {
    const filled = round ? round.matches.filter((m) => m.scoreA != null && m.scoreB != null).length : 0;
    const msg = filled > 0
      ? `Se sortearán parejas nuevas para esta ronda. Se perderá${filled !== 1 ? "n" : ""} ${filled} resultado${filled !== 1 ? "s" : ""} ya apuntado${filled !== 1 ? "s" : ""}. ¿Continuar?`
      : "¿Sortear de nuevo las parejas de esta ronda?";
    if (!confirm(msg)) return;
    regenerateCurrentRound();
  };

  // Al pulsar "Terminar ronda": si está todo apuntado, avanza directo.
  // Si faltan marcadores, abre la hoja para que decidas qué hacer con la ronda.
  const handleEndRound = () => {
    if (!round) return;
    const filled = round.matches.filter((m) => m.scoreA != null && m.scoreB != null).length;
    if (filled === round.matches.length) { endRound(); return; }
    setShowEndSheet(true);
  };

  const addPlayer = (name) => {
    setActive((prev) => ({ ...prev, players: [...prev.players, { id: uid(), name, absent: false }] }));
  };
  // "Retirar" un jugador: sale del sorteo pero CONSERVA sus puntos en la clasificación
  // (hasta el final del torneo). Reutiliza el flag `absent` para excluirlo del draw;
  // se distingue del ausente temporal con el flag `retired`, solo para etiquetarlo.
  const removePlayer = (id) => {
    setActive((prev) => ({
      ...prev,
      players: prev.players.map((p) => (p.id === id ? { ...p, absent: true, retired: true } : p)),
    }));
  };
  const toggleAbsent = (id) => {
    setActive((prev) => ({
      ...prev,
      players: prev.players.map((p) => (p.id === id ? { ...p, absent: !p.absent } : p)),
    }));
  };
  const setCourts = (n) => setActive((prev) => ({ ...prev, courts: Math.max(1, n) }));
  const setFormat = (f) => setActive((prev) => ({ ...prev, format: f }));
  const setDuration = (m) => setActive((prev) => ({ ...prev, roundDurationMin: m }));

  const configModal = showConfig && (
    <TournamentConfig players={players} courts={courts} format={format} durationMin={durationMin}
      onAdd={addPlayer} onRemove={removePlayer} onToggleAbsent={toggleAbsent}
      onCourtsChange={setCourts} onFormatChange={setFormat} onDurationChange={setDuration}
      onClose={() => setShowConfig(false)}/>
  );

  const matchesWithScores = round ? round.matches.filter((m) => m.scoreA != null && m.scoreB != null).length : 0;

  if (!round) {
    return (
      <div className="min-h-full flex flex-col">
        <BackHeader onBack={onBack} title={active.name} right={<SyncBadge mode={syncMode} hasError={hasError}/>}/>
        <div className="flex-1 flex items-center justify-center p-8 text-center">
          <div>
            <p className="text-[var(--text-2)] mb-1">No hay suficientes jugadores disponibles.</p>
            <p className="text-xs text-[var(--text-3)] mb-4">
              Hacen falta 4 sin marcar como ausentes ({availableCount} ahora mismo).
            </p>
            <button onClick={() => setShowConfig(true)}
              className="px-5 py-3 rounded-xl bg-[var(--lime)] text-black font-medium">Abrir configuración</button>
          </div>
        </div>
        {configModal}
      </div>
    );
  }

  return (
    <div className="min-h-full flex flex-col">
      <BackHeader onBack={onBack} title={active.name}
        right={
          <div className="flex items-center gap-2">
            <SyncBadge mode={syncMode} hasError={hasError}/>
            <button onClick={() => setShowConfig(true)}
              className="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] text-[var(--text-2)] active:bg-[var(--surface)] font-mono">
              {availableCount}j · {courts}p
            </button>
          </div>
        }/>

      <div className="px-5 flex items-center gap-2 pb-2">
        <span className="text-[10px] tracking-[0.15em] uppercase text-[var(--lime)] border border-[var(--lime)]/30 bg-[var(--lime)]/5 rounded-lg px-2 py-1">
          {FORMATS[format].short}
        </span>
        {durationMin > 0 && (
          <span className="text-[10px] tracking-[0.15em] uppercase text-[var(--text-3)] border border-[var(--border)] rounded-lg px-2 py-1 font-mono">
            {durationMin}′ / ronda
          </span>
        )}
        {players.some((p) => p.absent) && (
          <span className="text-[10px] tracking-[0.15em] uppercase text-[var(--orange)] border border-[var(--orange)]/30 rounded-lg px-2 py-1">
            {players.filter((p) => p.absent).length} ausente{players.filter((p) => p.absent).length !== 1 ? "s" : ""}
          </span>
        )}
      </div>

      <div className="px-5">
        <div className="flex gap-1 bg-[var(--surface)] border border-[var(--border)] rounded-xl p-1">
          <button onClick={() => setTab("round")}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${
              tab === "round" ? "bg-[var(--surface-2)] text-[var(--text)]" : "text-[var(--text-3)]"
            }`}>Ronda</button>
          <button onClick={() => setTab("table")}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${
              tab === "table" ? "bg-[var(--surface-2)] text-[var(--text)]" : "text-[var(--text-3)]"
            }`}>Clasificación</button>
        </div>
      </div>

      <main className="flex-1 px-5 py-4 pb-32">
        {tab === "round" ? (
          <RoundView round={round} players={players} onScoreChange={updateScore}
            roundNum={viewRound + 1} totalRounds={currentRoundIndex + 1} isCurrent={isCurrent}
            format={format} durationMin={durationMin} timerHandlers={timerHandlers}
            onReshuffle={reshuffleRound}
            onPrev={() => { setViewRound((v) => Math.max(0, v - 1)); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            onNext={() => { setViewRound((v) => Math.min(currentRoundIndex, v + 1)); window.scrollTo({ top: 0, behavior: "smooth" }); }}
          />
        ) : (
          <div className="space-y-4">
            <div className="flex items-end justify-between px-1">
              <h2 className="font-display text-[2rem] leading-none font-extrabold tracking-tight">Clasificación</h2>
              <div className="text-right">
                <div className="text-[10px] tracking-[0.2em] uppercase text-[var(--text-3)]">Ronda</div>
                <div className="font-mono text-xl font-bold">{String(currentRoundIndex + 1).padStart(2, "0")}</div>
              </div>
            </div>
            {format === "mexicano" && (
              <div className="rounded-xl border border-[var(--lime)]/25 bg-[var(--lime)]/5 px-4 py-3 text-[11px] text-[var(--lime)] leading-relaxed">
                Formato Mexicano: esta tabla define las parejas de la próxima ronda (1º+4º vs 2º+3º en cada pista).
              </div>
            )}
            <Standings players={players} rounds={rounds} />
          </div>
        )}
      </main>

      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom z-20">
        <div className="max-w-md mx-auto space-y-2">
          {tab === "round" && isCurrent && (
            <>
              <div className="flex items-center justify-between text-xs text-[var(--text-3)] mb-1 px-1">
                <span><span className="text-[var(--text)] font-mono">{matchesWithScores}</span>/{round.matches.length} partidos registrados</span>
                <button onClick={() => { if (confirm("¿Finalizar el torneo y ver al campeón?")) onFinish(); }}
                  className="underline underline-offset-2 hover:text-[var(--text-2)]">Finalizar torneo</button>
              </div>
              <button onClick={handleEndRound}
                className="w-full py-4 rounded-xl bg-[var(--lime)] text-black font-display font-bold text-lg active:scale-[0.98] transition-transform tracking-tight">
                Terminar ronda →
              </button>
            </>
          )}
          {tab === "round" && !isCurrent && (
            <>
              <div className="text-xs text-[var(--text-3)] mb-1 px-1 text-center">
                Editando una ronda finalizada · los cambios recalculan la clasificación
              </div>
              <button onClick={() => { setViewRound(currentRoundIndex); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                className="w-full py-4 rounded-xl bg-[var(--surface)] border border-[var(--lime)]/40 text-[var(--lime)] font-display font-bold text-lg active:scale-[0.98] transition-transform tracking-tight">
                Ir a ronda actual →
              </button>
            </>
          )}
          {tab === "table" && (
            <button onClick={() => setTab("round")}
              className="w-full py-4 rounded-xl bg-[var(--surface)] border border-[var(--border)] font-medium">Volver a la ronda</button>
          )}
        </div>
      </div>

      {configModal}

      {showEndSheet && round && (
        <EndRoundSheet
          roundNum={currentRoundIndex + 1}
          total={round.matches.length}
          filled={round.matches.filter((m) => m.scoreA != null && m.scoreB != null).length}
          isMexicano={format === "mexicano"}
          onSave={endRound}
          onDiscard={regenerateCurrentRound}
          onCancel={() => setShowEndSheet(false)}
        />
      )}
    </div>
  );
}

              {champion?.name || "—"}

      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[var(--bg)] via-[var(--bg)] to-transparent pt-4 px-5 safe-bottom z-20">
